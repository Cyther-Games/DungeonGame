# Builds the Android app (an APK) on GitHub's servers.
# It runs on every push to main (and on v* tags), or from the Actions tab:
# "Android build" > "Run workflow".
# When it finishes, the APK is under the run's Artifacts as "Dungeon-android".
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache \
            libltdl-dev
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython setuptools

      # Two caches, saved even when a build fails so the next try is quicker:
      # the Android SDK / NDK download, and the compiled libraries - the latter only reused
      # while buildozer.spec and the recipes are unchanged, so a settings change starts clean.
      - name: Restore the Android SDK / NDK
        uses: actions/cache/restore@v4
        with:
          path: ~/.buildozer
          key: sdk-${{ runner.os }}-${{ github.run_id }}
          restore-keys: sdk-${{ runner.os }}-

      - name: Restore earlier build work
        uses: actions/cache/restore@v4
        with:
          path: .buildozer
          key: work-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}-${{ github.run_id }}
          restore-keys: work-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}-

      # pygame on Android may not read PNGs, so the game also gets plain-pixel copies
      - name: Pack the images for Android
        run: |
          python -m pip install pygame
          python .github/workflows/pack_images.py

      - name: Build the APK
        run: |
          { yes | buildozer -v android debug; } 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Save the Android SDK / NDK
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.buildozer
          key: sdk-${{ runner.os }}-${{ github.run_id }}

      - name: Save the build work
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .buildozer
          key: work-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}-${{ github.run_id }}

      # Build logs need a GitHub sign-in to read, but a run's annotations don't: when the
      # build fails, put its errors and last lines in one, so anyone can see why.
      - name: Show why the build failed
        if: failure()
        run: python .github/workflows/why_failed.py build.log

      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-android
          path: bin/*.apk
          if-no-files-found: error
