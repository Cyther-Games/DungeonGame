# Builds the Android app (an APK) on GitHub's servers.
# Run it from the repository's Actions tab: "Android build" > "Run workflow".
# When it finishes, the APK is under the run's Artifacts as "Dungeon-android".
name: Android build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython setuptools

      - name: Reuse the Android SDK / NDK and earlier builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build the APK
        run: yes | buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-android
          path: bin/*.apk
          if-no-files-found: error
