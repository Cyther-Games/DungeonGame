# Builds the Android app (an APK) on GitHub's servers.
# It runs on every push to main (and on v* tags), or from the Actions tab:
# "Android build" > "Run workflow".
# When it finishes, the APK is under the run's Artifacts as "Dungeon-android".
name: Android build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip autoconf automake libtool libtool-bin pkg-config \
            zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev build-essential ccache
          python -m pip install --upgrade pip
          python -m pip install buildozer==1.6.0 cython setuptools

      - name: Reuse the Android SDK / NDK and earlier builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec', 'p4a-recipes/**') }}
          restore-keys: buildozer-${{ runner.os }}-

      - name: Build the APK
        run: |
          { yes | buildozer -v android debug; } 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      # Build logs need a GitHub sign-in to read, but a run's annotations don't: when the
      # build fails, put its errors and last lines in one, so anyone can see why.
      - name: Show why the build failed
        if: failure()
        run: |
          {
            echo "--- error lines ---"
            grep -nE "Error|error:|Exception|Traceback|FAILED|No such file|not found" build.log | tail -n 40
            echo "--- last lines ---"
            tail -n 70 build.log
          } | cut -c1-220 > why.txt || true
          msg=$(sed -e 's/%/%25/g' why.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Android build failed::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: Dungeon-android
          path: bin/*.apk
          if-no-files-found: error
